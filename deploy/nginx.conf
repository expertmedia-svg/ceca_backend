# Placer cette limite dans le contexte http de nginx (sites-enabled est généralement inclus dans http).
limit_req_zone $binary_remote_addr zone=ceca_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ceca_public:10m rate=10r/m;

server {
    listen 80;
    server_name cecadrbackend.yingr-ai.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name cecadrbackend.yingr-ai.com;
    ssl_certificate /etc/letsencrypt/live/cecadrbackend.yingr-ai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cecadrbackend.yingr-ai.com/privkey.pem;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /auth/login {
        limit_req zone=ceca_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8657;
        include /etc/nginx/proxy_params;
    }
    location ~ ^/(contact|newsletter)$ {
        limit_req zone=ceca_public burst=5 nodelay;
        proxy_pass http://127.0.0.1:8657;
        include /etc/nginx/proxy_params;
    }
    location / {
        proxy_pass http://127.0.0.1:8657;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
